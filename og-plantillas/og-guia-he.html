<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Heebo:wght@300;400&family=Frank+Ruhl+Libre:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#545E45;position:relative}
  body::before{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.9}
  .og{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:.9fr 1.1fr;align-items:center;color:var(--paper);padding:0 80px;box-sizing:border-box;gap:40px}
  .og img{width:100%;height:auto;display:block;filter:invert(1) brightness(1.02)}
  .t{text-align:center}
  .script{font-family:var(--script);font-size:96px;line-height:1;margin:0 0 18px;color:var(--paper)}
  .kicker{font-family:var(--display);font-size:30px;letter-spacing:.22em;text-transform:uppercase;margin:0 0 10px}
  .kicker.sm{font-size:24px;opacity:.9}
  .body{font-family:var(--body);font-weight:300;font-size:26px;margin:14px 0 0;opacity:.95}
  .foto{position:relative;width:360px;aspect-ratio:3/4;margin:0 auto;transform:rotate(-1.5deg)}
  .foto img{position:absolute;inset:11.5%;width:77%;height:77%;object-fit:cover;filter:sepia(.12) saturate(.95);border-radius:2px}
  .foto .m{position:absolute;inset:0;width:100%;height:100%;filter:invert(1) brightness(1.02)}
  html[dir=rtl] .script{font-family:"Frank Ruhl Libre",serif;font-weight:300;font-size:84px;letter-spacing:.02em}
  html[dir=rtl] .kicker{font-family:"Frank Ruhl Libre",serif;letter-spacing:.12em}
  html[dir=rtl] .body{font-family:Heebo,sans-serif}
</style></head><body><div class="og">
       <div class="foto"><img src="../img/foto-mate.jpg"><img class="m" src="../img/marco-foto.svg"></div>
       <div class="t"><p class="script">המדריך של הכלות</p><p class="kicker sm">פונטה דל אסטה</p><p class="body">כל מה שצריך לדעת,<br>מפינו.</p></div></div></body></html>
